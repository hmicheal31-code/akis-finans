<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c192b">
  <meta name="description" content="Kişisel kredi kartı, taksit, kredi ve nakit akışı takip uygulaması. Veriler yalnızca cihazında saklanır.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akış Finans">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Akış — Kişisel Finans Takibi</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-area">
        <div class="brand-mark" aria-hidden="true">↗</div>
        <div><div class="brand">akış<span>.</span></div><div class="brand-sub">Kişisel finans merkezim</div></div>
      </div>
      <div class="top-actions"><span class="private-tag"><span class="signal-dot"></span> Cihazına özel</span><button class="icon-button" data-action="show-help" aria-label="Uygulama hakkında">?</button></div>
    </header>

    <main id="app-main">
      <div class="page-heading"><div><p class="eyebrow" id="greeting">Finans görünümün</p><h1 id="page-title">Para kontrolü sende.</h1></div><div class="month-picker" role="group" aria-label="Ay seçimi"><button id="previous-month" aria-label="Önceki ay">‹</button><span id="month-label"></span><button id="next-month" aria-label="Sonraki ay">›</button></div></div>
      <div id="content"></div>
    </main>

    <nav class="bottom-nav" aria-label="Ana gezinme">
      <button class="nav-btn active" data-tab="dashboard"><span class="nav-icon">▦</span><span>Özet</span></button>
      <button class="nav-btn" data-tab="calendar"><span class="nav-icon">▤</span><span>Takvim</span></button>
      <button class="nav-btn" data-tab="cards"><span class="nav-icon">▰</span><span>Kartlar</span></button>
      <button class="nav-btn" data-tab="records"><span class="nav-icon">≡</span><span>Kayıtlar</span></button>
      <button class="nav-btn" data-tab="settings"><span class="nav-icon">⚙</span><span>Ayarlar</span></button>
    </nav>
  </div>

  <div id="modal-root" class="modal-root" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite" class="toast"></div>
  <script defer src="app.js"></script>
</body>
</html>
